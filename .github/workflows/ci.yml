name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  repo-hygiene:
    name: Repo hygiene (no user data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if audio/video uploads or Whisper models are tracked
        run: |
          forbidden=$(git ls-files | grep -Ei '(\.(mp3|ogg|wav|m4a|flac|webm|opus|mp4|mkv|mov)$|(^|/)temp-uploads/|(^|/)whisper-models/|ggml-.*\.bin$)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::User data or model files must not be committed (see UserStories S01):"
            echo "$forbidden"
            exit 1
          fi
          echo "OK: no audio uploads or model files tracked."

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AudioTranscription.slnx

      - name: Build
        run: dotnet build AudioTranscription.slnx --no-restore -c Release

      - name: Test
        run: dotnet test AudioTranscription.slnx --no-build -c Release --logger "html;LogFileName=test-results.html" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/test-results.html
          if-no-files-found: warn

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AudioTranscription.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AudioTranscription.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false

  e2e-mocked:
    name: Frontend E2E (mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AudioTranscription.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AudioTranscription.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (core flows, faked API)
        run: npx playwright test --project=mocked

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: AudioTranscription.Web/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  e2e-stack:
    # S31 stage 2: the same kind of flows against the real stack - SQL Server with full-text search, the API with a
    # real Whisper model, and the app - including a second and third user and live updates over SignalR
    name: Frontend E2E (real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_EMAIL: admin@e2e.example.com
      E2E_BASE_URL: http://localhost:4200
      E2E_SPEECH_PHRASE: fox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AudioTranscription.Web/package-lock.json

      - name: Throw-away credentials for this run (admin account and SQL Server)
        run: |
          # Random per run, never stored: 24 hex characters plus one character of each class the password rules ask for
          make_secret() { printf '%s%s' "$(openssl rand -hex 12)" "$(printf '\101\141\061\041')"; }
          echo "E2E_PASSWORD=$(make_secret)" >> "$GITHUB_ENV"
          echo "SQL_PASSWORD=$(make_secret)" >> "$GITHUB_ENV"

      - name: Install ffmpeg (used by the API) and a speech synthesizer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Generate a spoken test sentence
        run: |
          espeak-ng -v en -s 130 -w "$RUNNER_TEMP/speech.wav" "The quick brown fox jumps over the lazy dog"
          echo "E2E_SPEECH_WAV=$RUNNER_TEMP/speech.wav" >> "$GITHUB_ENV"

      - name: Start SQL Server (with Full-Text Search)
        run: |
          docker build -t audio-transcription-sql-e2e docker/mssql-fts
          docker run -d --name e2e-sql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_PASSWORD" audio-transcription-sql-e2e
          for i in $(seq 1 60); do
            docker logs e2e-sql 2>&1 | grep -q "SQL Server is now ready for client connections" && exit 0
            sleep 5
          done
          echo "::error::SQL Server did not become ready"; docker logs e2e-sql | tail -30; exit 1

      - name: Start the API
        env:
          ConnectionStrings__transcriptiondb: Server=localhost,1433;Database=transcriptiondb;User Id=sa;Password=${{ env.SQL_PASSWORD }};TrustServerCertificate=True;
          Auth__InitialUser__Email: ${{ env.E2E_EMAIL }}
          Auth__InitialUser__Password: ${{ env.E2E_PASSWORD }}
          ASPNETCORE_URLS: http://localhost:5081
          Whisper__DefaultModel: Base
          Upload__TempStoragePath: ${{ runner.temp }}/uploads
          # The transcript test opens the player at a search hit; without this the upload is deleted after transcription
          Upload__DeleteAfterTranscription: 'false'
        run: |
          dotnet run --project AudioTranscription.Api -c Release --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5081/api/auth/me || true)
            [ "$code" = "401" ] && exit 0
            sleep 3
          done
          echo "::error::The API did not start"; tail -50 "$RUNNER_TEMP/api.log"; exit 1

      - name: Install dependencies
        working-directory: AudioTranscription.Web
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: AudioTranscription.Web
        run: npx playwright install --with-deps chromium

      - name: Start the app (dev server with the proxy to the API)
        working-directory: AudioTranscription.Web
        env:
          services__api__http__0: http://localhost:5081
        run: |
          npm start -- --port 4200 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4200 && exit 0
            sleep 2
          done
          echo "::error::The app did not start"; tail -30 "$RUNNER_TEMP/web.log"; exit 1

      - name: E2E tests (real stack)
        working-directory: AudioTranscription.Web
        run: npx playwright test --project=stack

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stack
          path: |
            AudioTranscription.Web/playwright-report/
            AudioTranscription.Web/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log-stack
          path: ${{ runner.temp }}/api.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop SQL Server
        if: always()
        run: docker rm -f e2e-sql

