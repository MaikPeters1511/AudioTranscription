name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  repo-hygiene:
    name: Repo hygiene (no user data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if audio/video uploads or Whisper models are tracked
        run: |
          forbidden=$(git ls-files | grep -Ei '(\.(mp3|ogg|wav|m4a|flac|webm|opus|mp4|mkv|mov)$|(^|/)temp-uploads/|(^|/)whisper-models/|ggml-.*\.bin$)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::User data or model files must not be committed (see UserStories S01):"
            echo "$forbidden"
            exit 1
          fi
          echo "OK: no audio uploads or model files tracked."

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore AudioTranscription.slnx

      - name: Build
        run: dotnet build AudioTranscription.slnx --no-restore -c Release

      - name: Test
        run: dotnet test AudioTranscription.slnx --no-build -c Release --logger "html;LogFileName=test-results.html" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/**/test-results.html
          if-no-files-found: warn

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AudioTranscription.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AudioTranscription.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false
