version: '3.8'

services:
  sql:
    build:
      context: ./docker/mssql-fts
    container_name: audio-transcription-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: AudioTranscription.Api/Dockerfile
    container_name: audio-transcription-api
    depends_on:
      - sql
    environment:
      - ConnectionStrings__transcriptiondb=Server=sql;Database=transcriptiondb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      # First login (ADR 0003); set in a local, git-ignored .env file
      - Auth__InitialUser__Email=${INITIAL_USER_EMAIL:-}
      - Auth__InitialUser__Password=${INITIAL_USER_PASSWORD:-}
      # S14: single source of truth for the upload size limit, also used by the web service below
      - Upload__MaxFileSizeBytes=${UPLOAD_MAX_FILE_SIZE_MB:-500}000000
      # S27: how long an unfinished resumable upload is kept before it is removed
      - Upload__IncompleteSessionRetentionHours=${UPLOAD_INCOMPLETE_RETENTION_HOURS:-24}
      # S29: empty = no export; with the observability profile set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/uploads

  # S15-T3: GPU-accelerated variant, opt-in via `docker compose --profile gpu up api-gpu`.
  # Runs alongside the default "api" service (different host port) rather than replacing it, so
  # the default `docker compose up` flow keeps working unchanged without a GPU.
  api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: AudioTranscription.Api/Dockerfile
      target: final-cuda
    container_name: audio-transcription-api-gpu
    depends_on:
      - sql
    environment:
      - ConnectionStrings__transcriptiondb=Server=sql;Database=transcriptiondb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Auth__InitialUser__Email=${INITIAL_USER_EMAIL:-}
      - Auth__InitialUser__Password=${INITIAL_USER_PASSWORD:-}
      - Upload__MaxFileSizeBytes=${UPLOAD_MAX_FILE_SIZE_MB:-500}000000
      # S27: how long an unfinished resumable upload is kept before it is removed
      - Upload__IncompleteSessionRetentionHours=${UPLOAD_INCOMPLETE_RETENTION_HOURS:-24}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    ports:
      - "8081:8080"
    volumes:
      - api-uploads:/app/uploads

  web:
    build:
      context: ./AudioTranscription.Web
      dockerfile: Dockerfile
    container_name: audio-transcription-web
    depends_on:
      - api
    environment:
      # S14: derived from the same UPLOAD_MAX_FILE_SIZE_MB value as the api service above
      - NGINX_CLIENT_MAX_BODY_SIZE=${UPLOAD_MAX_FILE_SIZE_MB:-500}M
    ports:
      - "80:80"

  # S29-T3: metrics dashboard, opt-in via `docker compose --profile observability up`.
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 in .env so the API sends its telemetry to the collector.
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: audio-transcription-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otel/config.yaml:ro

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.0
    container_name: audio-transcription-prometheus
    depends_on:
      - otel-collector
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    container_name: audio-transcription-grafana
    depends_on:
      - prometheus
    environment:
      # Local only; change it when exposing Grafana. Anonymous access stays off.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  sql-data:
  api-uploads:
